<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>ORKEN EVENTS — «Бажа» фильміне билеттер</title>
<meta name="description" content="«Бажа» фильмінің топтық көрсетілімі. Arman Asia Park, Астана. Групповой показ фильма «Бажа».">
<meta property="og:title" content="ORKEN EVENTS — «Бажа»">
<meta property="og:description" content="«Бажа» фильмінің топтық көрсетілімі · Arman Asia Park, Астана">
<meta property="og:type" content="website">
<style>
:root{--bg:#0a0a0b;--g1:#121214;--g2:#1a1a1e;--g3:#232329;--line:#2a2a30;--tx:#f4f4f5;--mu:#9a9aa3;--red:#b3121f;--red2:#d91c2b;--green:#22c55e;--blue:#3b82f6;--grey:#45454d;--sold:#991b1b;--yel:#eab308}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
#demobar{background:#1a0b0d;border-bottom:1px solid #3a1418;font-size:12px;color:#f0bcc1;padding:7px 0}
#demobar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#demobar select,#demobar button{height:28px;font-size:12px;background:#2a1215;color:#ffd9dc;border:1px solid #5a2228;border-radius:7px;padding:0 8px;width:auto}
header{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px}
.logo{font-weight:800;letter-spacing:.2em;font-size:16px;text-decoration:none;white-space:nowrap}
.logo img{height:46px;display:block;mix-blend-mode:screen}.ticket .lg img{height:34px;display:block;mix-blend-mode:multiply;margin-left:-4px}
nav.main{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--mu);white-space:nowrap;font-size:14px;transition:.2s}
nav.main a.on,nav.main a:hover{color:var(--tx);background:var(--g2)}
nav.main a.adm{color:#f0bcc1}
@media(max-width:820px){.hd{flex-direction:column;height:auto;padding:10px 18px 6px;align-items:flex-start;gap:4px}nav.main{width:100%;margin:0 -6px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:10px;border:1px solid var(--line);background:var(--g2);color:var(--tx);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,transform .1s;font-family:inherit}
.btn:hover{border-color:#3d3d45;background:var(--g3)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2);border-color:var(--red2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.w{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.01em}
h3{font-size:18px}
.hero{display:grid;grid-template-columns:minmax(0,330px) 1fr;gap:52px;padding:60px 0;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:26px;padding:26px 0}.poster{max-width:260px}}
.poster{aspect-ratio:2/3;border-radius:16px;background:radial-gradient(120% 80% at 50% 0%,#24161a 0%,#0e0e11 70%);border:1px dashed #3a3a42;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:22px;overflow:hidden;width:100%}
.poster img{width:100%;height:100%;object-fit:cover}
.poster.has{padding:0;border-style:solid}
.eyebrow{color:var(--red2);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.title{font-size:clamp(64px,13vw,132px);font-weight:800;letter-spacing:-.04em;margin:6px 0 14px;line-height:.95}
.lead{color:#c9c9cf;font-size:17px;max-width:560px;margin:0 0 22px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;color:var(--mu);font-size:13px}
.stats b{display:block;color:var(--tx);font-size:22px}
section.blk{padding:52px 0;border-top:1px solid var(--line)}
.h2{font-size:clamp(28px,4.4vw,40px);font-weight:800;margin-bottom:22px;letter-spacing:-.02em}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--g1);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--mu)}.small{font-size:13px}.tiny{font-size:12px}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ph{color:#f0a9b0;background:#26100f;border:1px dashed #5a2228;border-radius:6px;padding:1px 7px;font-size:13px}
.time{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--g2);border:1px solid var(--line);white-space:nowrap}
.b-green{color:#86efac;border-color:#14532d;background:#0b1d12}
.b-red{color:#fca5a5;border-color:#7f1d1d;background:#220b0d}
.b-yel{color:#fde68a;border-color:#713f12;background:#221a07}
.b-blue{color:#bfdbfe;border-color:#1e3a8a;background:#0b1428}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--g1);color:var(--mu);font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx);font-weight:600}
input,select,textarea{width:100%;min-height:46px;background:var(--g1);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:0 14px;font-size:16px;font-family:inherit;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:#55555f}
textarea{padding:12px 14px;min-height:90px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--red2)}
input[type=file]{padding:10px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#c9c9cf;margin:10px 0;cursor:pointer}
.check input{flex:none;margin-top:1px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
td.r,th.r{text-align:right}
.mapbox{background:var(--g1);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:520px;-webkit-overflow-scrolling:touch;position:relative}
.mapbox svg{display:block;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--mu)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.seat{cursor:pointer}
.seat text{pointer-events:none;font-weight:600}
.bar{position:sticky;bottom:0;background:rgba(14,14,16,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom));z-index:20;margin-top:18px}
.steps{display:flex;gap:6px;margin:16px 0 18px;overflow-x:auto}
.steps div{flex:1;min-width:70px;font-size:12px;color:var(--mu);border-top:3px solid var(--line);padding-top:7px;white-space:nowrap}
.steps div.on{color:var(--tx);border-color:var(--red2)}
.steps div.done{color:#c9c9cf;border-color:#5a2228}
.ticket{display:grid;grid-template-columns:1fr auto;gap:16px;background:#f4f4f5;color:#0a0a0b;border-radius:16px;padding:18px 18px 16px;position:relative;overflow:hidden}
.ticket:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
.ticket .lg{font-weight:800;letter-spacing:.2em;font-size:12px}.ticket .lg span{color:var(--red)}
.ticket .mv{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.ticket .qr svg{width:124px;height:124px;display:block}
.ticket .kv{display:grid;grid-template-columns:repeat(3,auto);gap:6px 16px;font-size:11px;color:#55555c;text-transform:uppercase;letter-spacing:.04em}
.ticket .kv b{display:block;font-size:15px;color:#0a0a0b;text-transform:none;letter-spacing:0}
.ticket .num{font-family:ui-monospace,Menlo,monospace;font-size:12px;text-align:center;margin-top:6px}
.ticket.void{opacity:.55}.ticket.void:after{content:attr(data-void);position:absolute;right:14px;top:14px;background:#0a0a0b;color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
@media(max-width:480px){.ticket{grid-template-columns:1fr}.ticket .qr{justify-self:center}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#f4f4f5;color:#0a0a0b;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#7f1d1d;color:#fff}
.stat{font-size:clamp(20px,5.5vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0;scrollbar-width:none}
.tabs a{flex:none;padding:8px 14px;border-radius:9px;border:1px solid var(--line);text-decoration:none;font-size:14px;color:var(--mu)}
.tabs a.on{background:var(--tx);color:#000;border-color:var(--tx);font-weight:600}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.timer{font-variant-numeric:tabular-nums;color:var(--yel);font-weight:700}
.result{border-radius:16px;padding:22px;text-align:center}
.result .big{font-size:30px;font-weight:800;margin-bottom:6px}
.r-ok{background:#0b2414;border:1px solid #166534}.r-bad{background:#260b0e;border:1px solid #7f1d1d}.r-warn{background:#261f08;border:1px solid #854d0e}
.step3 .n{width:44px;height:44px;border-radius:50%;border:1px solid #5a2228;color:var(--red2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-bottom:14px}
details.faq{border-bottom:1px solid var(--line);padding:14px 0}
details.faq summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary:after{content:"+";color:var(--red2);font-size:20px;line-height:1}
details.faq[open] summary:after{content:"−"}
details.faq p{color:#c9c9cf;margin:10px 0 0}
.sbx{background:#fafafa;color:#111;border-radius:18px;padding:22px;max-width:440px;margin:24px auto}
.sbx .warn{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:10px;padding:10px 12px;font-size:13px}
.sbx .btn{border-color:#ddd;background:#fff;color:#111}
.sbx .btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.sbx .btn.no{background:#fff;color:#b91c1c;border-color:#fca5a5}
.sbx input{background:#fff;color:#111;border-color:#ddd}
footer{border-top:1px solid var(--line);padding:30px 0 50px;color:var(--mu);font-size:13px;margin-top:30px}
footer a{color:var(--mu)}
.pill{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--g2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;word-break:break-all}
.ed-tools{display:flex;gap:6px;flex-wrap:wrap}
.ed-tools label{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;cursor:pointer}
.ed-tools label:has(input:checked){border-color:var(--tx);background:var(--g2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.lang button{background:transparent;border:0;color:var(--mu);font:600 12px/1 inherit;font-family:inherit;padding:9px 11px;cursor:pointer;letter-spacing:.06em}
.lang button.on{background:var(--tx);color:#000}
.poster.has{aspect-ratio:auto;border:0;max-width:420px}.poster.has img{height:auto;display:block}
@media(max-width:820px){.top{width:100%}}
@media(max-width:760px){.poster.has{max-width:100%}}
.pv #demobar,.pv .ph,.pv footer .row{display:none}
#print-area{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  #print-area .ticket{break-inside:avoid;margin:0 0 14px;border:1px solid #999}
}
video#cam{width:100%;border-radius:14px;background:#000;max-height:320px;object-fit:cover}
</style>
</head>

    if(String(code)!==o.code){o.tries++;save();throw err('VALIDATION_ERROR','Неверный код')}
    delete db.otps[phone];return S.issueSession(phone);
  },
  issueSession(phone){const t=rnd(24);db.sessions[t]=phone;save();return t},
  sessionPhone:t=>(t&&db.sessions[t])||null,

  /* POST /api/public/orders — hold seats + create order (one "transaction") */
  createOrder(inp){
    if(!inp.idem)throw err('VALIDATION_ERROR','Нет ключа идемпотентности');
    const ex=db.orders.find(o=>o.idem===inp.idem);
    if(ex)return{order:ex,token:ex.token,repeat:true};
    const scr=S.scr(inp.scrId);
    if(!scr)throw err('NOT_FOUND','Сеанс не найден');
    if(!S.salesOpen(scr))throw err('CONFLICT','Продажа на этот сеанс закрыта');
    const ids=[...new Set(inp.seatIds||[])];
    if(!ids.length)throw err('VALIDATION_ERROR','Выберите хотя бы одно место');
    if(ids.length>db.settings.maxSeats)throw err('VALIDATION_ERROR',`Не больше ${db.settings.maxSeats} мест в одном заказе`);
    const name=String(inp.name||'').trim().replace(/\s+/g,' ');
    if(name.length<2||name.length>120)throw err('VALIDATION_ERROR','Укажите имя и фамилию');
    const phone=S.sessionPhone(inp.session); // phone comes only from a verified session, never from the form
    if(!phone)throw err('UNAUTHORIZED','Сначала подтвердите номер телефона');
    const email=String(inp.email||'').trim();
    if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw err('VALIDATION_ERROR','Проверьте email');
    if(!inp.offer||!inp.pd)throw err('VALIDATION_ERROR','Нужно согласие с офертой и на обработку персональных данных');
    const h=S.hall(scr.hallId),bl=db.blocks[scr.id]||[],t=now();
    // clear expired holds on exactly these seats
    for(const id of ids){const l=db.locks[S.key(scr.id,id)];if(l&&l.status==='HELD'&&l.exp<=t)S.expireOrder(l.orderId,'sweep')}
    const seats=ids.map(id=>h.seats.find(s=>s.id===id));
    const bad=ids.filter((id,i)=>!seats[i]||!seats[i].active||bl.includes(id));
    if(bad.length)throw err('SEATS_TAKEN','Некоторые места недоступны',{seatIds:bad});
    const taken=ids.filter(id=>db.locks[S.key(scr.id,id)]);
    if(taken.length)throw err('SEATS_TAKEN','Эти места только что заняли',{seatIds:taken});
    if(scr.limit){const used=Object.keys(db.locks).filter(k=>k.startsWith(scr.id+'|')).length;if(used+ids.length>scr.limit)throw err('SEATS_TAKEN','Лимит мест на этот сеанс исчерпан')}
    let cust=db.customers.find(c=>c.phone===phone);
    if(!cust){cust={id:uid('cus'),name,phone,email,created:t};db.customers.push(cust)}else{cust.name=name;if(email)cust.email=email}
    const order={id:uid('ord'),number:'BZ-'+scr.startsAt.slice(2,10).replace(/-/g,'')+'-'+code(4),customerId:cust.id,scrId:scr.id,
      status:'PENDING_PAYMENT',items:[],total:0,currency:'KZT',token:rnd(24),idem:inp.idem,holdExp:t+(db.settings.invoiceMode==='manual'?30:S.holdMin(scr))*60000,extended:false,created:t,paidAt:null};
    for(const s of seats){const it={id:uid('itm'),seatId:s.id,r:s.r,n:s.n,cat:s.cat,price:S.priceFor(scr,s),status:'ACTIVE'};order.items.push(it);order.total+=it.price}
    for(const it of order.items)db.locks[S.key(scr.id,it.seatId)]={orderId:order.id,itemId:it.id,status:'HELD',exp:order.holdExp};
    db.orders.push(order);
    if(db.settings.invoiceMode!=='manual')S.startPayment(order.token); // invoice goes to the buyer's Kaspi number right away
    save();
    return{order,token:order.token};
  },
  /* Manual mode: the admin issues the invoice in the Kaspi Pay app and marks it here */
  manualInvoice(orderId,actor){
    const o=S.order(orderId);
    if(!o||o.status!=='PENDING_PAYMENT')throw err('CONFLICT','Заказ не ожидает оплаты');
    if(db.payments.some(p=>p.orderId===o.id&&p.status==='PENDING'))throw err('CONFLICT','Счёт уже выставлен');
    const exp=now()+S.holdMin(S.scr(o.scrId))*60000;
    const p={id:uid('pay'),orderId:o.id,provider:'kaspi-manual',ext:'MAN-'+code(8),amount:o.total,currency:'KZT',status:'PENDING',idem:uid('idem'),url:null,exp,created:now(),paidAt:null,fail:null};
    db.payments.push(p);o.holdExp=exp;for(const k in db.locks)if(db.locks[k].orderId===o.id&&db.locks[k].status==='HELD')db.locks[k].exp=exp;
    S.audit(actor,'invoice.issued','order',o.number,money(o.total));save();return p;
  },
  manualPaid(payId,actor){
    const p=db.payments.find(x=>x.id===payId);
    if(!p||p.provider!=='kaspi-manual'||!['PENDING','EXPIRED'].includes(p.status))throw err('CONFLICT','Этот счёт уже обработан');
    p.status='PAID';p.paidAt=now();S.audit(actor,'invoice.paid','order',S.order(p.orderId).number,money(p.amount));S.confirmPaid(p.orderId);save();
  },
  manualUndelivered(orderId,actor){
    const o=S.order(orderId);if(!o||o.status!=='PENDING_PAYMENT')throw err('CONFLICT','Заказ не ожидает оплаты');
    o.status='CANCELLED';o.cancelReason='Счёт не удалось выставить: номер не привязан к Kaspi';o.items.forEach(i=>i.status='RELEASED');S.releaseLocks(o);
    db.payments.filter(p=>p.orderId===o.id&&p.status==='PENDING').forEach(p=>p.status='FAILED');S.audit(actor,'invoice.undelivered','order',o.number);save();
  },
  releaseLocks(o){for(const k in db.locks)if(db.locks[k].orderId===o.id)delete db.locks[k]},
  expireOrder(orderId,why){
    const o=S.order(orderId);if(!o||o.status!=='PENDING_PAYMENT')return;
    // before expiring, ask provider — customer may have just paid
    for(const p of db.payments.filter(p=>p.orderId===o.id&&(p.status==='PENDING'||p.status==='PROCESSING'))){
      const st=Provider.getStatus(p.ext);
      if(st&&st.status==='PAID'){S.recordPoll(p,st);S.applyProviderStatus(p,st);if(o.status!=='PENDING_PAYMENT')return}
    }
    o.status='EXPIRED';o.items.forEach(i=>i.status='RELEASED');S.releaseLocks(o);
    db.payments.filter(p=>p.orderId===o.id&&p.status==='PENDING').forEach(p=>{p.status='EXPIRED';if(p.provider===Provider.name)Provider.cancel(p.ext)});
    save();
  },
  cancelByCustomer(token){
    const o=S.byToken(token);if(!o)throw err('NOT_FOUND','Заказ не найден');
    if(o.status!=='PENDING_PAYMENT')throw err('CONFLICT','Этот заказ нельзя отменить');
    o.status='CANCELLED';o.items.forEach(i=>i.status='RELEASED');S.releaseLocks(o);
    db.payments.filter(p=>p.orderId===o.id&&p.status==='PENDING').forEach(p=>{p.status='EXPIRED';if(p.provider===Provider.name)Provider.cancel(p.ext)});save();
  },
  /* POST /api/public/orders/:token/payments */
  startPayment(token){
    const o=S.byToken(token);if(!o)throw err('NOT_FOUND','Заказ не найден');
    if(o.status!=='PENDING_PAYMENT')throw err('CONFLICT','Заказ не ожидает оплаты');
    if(o.holdExp<=now()){S.expireOrder(o.id);throw err('HOLD_EXPIRED','Время брони истекло, места освобождены')}
    let p=db.payments.find(p=>p.orderId===o.id&&p.status==='PENDING'&&p.exp>now());
    if(!p){
      const idem=uid('idem');
      const res=Provider.createPayment({amount:o.total,currency:'KZT',idem,orderNumber:o.number,expiresAt:o.holdExp});
      p={id:uid('pay'),orderId:o.id,provider:Provider.name,ext:res.ext,amount:o.total,currency:'KZT',status:'PENDING',idem,url:res.url,exp:res.expiresAt,created:now(),paidAt:null,fail:null};
      db.payments.push(p);
    }
    save();return p;
  },
  /* POST /api/webhooks/payments/sandbox */
  handleWebhook(e){
    if(db.events.some(x=>x.eventId===e.eventId&&x.kind==='webhook')){
      db.events.push({...e,id:uid('pe'),kind:'webhook',proc:'IGNORED',note:'Повтор уведомления — пропущено (идемпотентность)',at:now()});save();return'IGNORED';
    }
    const ev={...e,id:uid('pe'),kind:'webhook',at:now(),sigOk:Provider.sign(e)===e.sig,proc:'RECEIVED',note:''};
    db.events.push(ev);
    if(!ev.sigOk){ev.proc='FAILED';ev.note='Неверная подпись — отклонено';save();return'FAILED'}
    const p=db.payments.find(p=>p.ext===e.ext);
    if(!p){ev.proc='FAILED';ev.note='Платёж не найден';save();return'FAILED'}
    ev.paymentId=p.id;
    const st=Provider.getStatus(p.ext); // source of truth: re-check with provider
    ev.note=S.applyProviderStatus(p,st);ev.proc='PROCESSED';save();return'PROCESSED';
  },
  recordPoll(p,st){db.events.push({id:uid('pe'),kind:'poll',eventId:'POLL-'+code(6),ext:p.ext,status:st.status,amount:st.amount,paymentId:p.id,proc:'PROCESSED',note:'Сверка статуса с провайдером',at:now()})},
  applyProviderStatus(p,st){
    if(!st)return'Нет данных от провайдера';
    if(st.status==='PAID'){
      if(st.amount!==p.amount||st.currency!=='KZT'){p.status='FAILED';p.fail='Сумма или валюта не совпадает';S.audit(null,'payment.amount_mismatch','payment',p.id);return'Сумма не совпадает — заказ не подтверждён'}
      if(p.status==='PAID')return'Уже подтверждён ранее';
      p.status='PAID';p.paidAt=now();S.confirmPaid(p.orderId);return'Оплата подтверждена';
    }
    if(st.status==='FAILED'&&p.status!=='PAID'){p.status='FAILED';p.fail='Счёт отклонён клиентом';const o=S.order(p.orderId);if(o.status==='PENDING_PAYMENT'){o.status='CANCELLED';o.cancelReason='Счёт отклонён';o.items.forEach(i=>i.status='RELEASED');S.releaseLocks(o)}return'Счёт отклонён клиентом'}
    if((st.status==='EXPIRED'||st.status==='CANCELLED')&&p.status==='PENDING'){p.status='EXPIRED';return'Счёт истёк'}
    return'Без изменений';
  },
  confirmPaid(orderId){
    const o=S.order(orderId);
    if(['PAID','PARTIALLY_REFUNDED','REFUNDED','PAID_CONFLICT'].includes(o.status))return;
    const conflict=o.items.some(it=>{const l=db.locks[S.key(o.scrId,it.seatId)];return l&&l.orderId!==o.id});
    o.paidAt=now();
    if(conflict){o.status='PAID_CONFLICT';S.audit(null,'order.paid_conflict','order',o.number,'Оплата пришла после окончания брони, места уже заняты');save();return}
    for(const it of o.items){it.status='ACTIVE';db.locks[S.key(o.scrId,it.seatId)]={orderId:o.id,itemId:it.id,status:'SOLD',exp:null}}
    o.status='PAID';
    for(const it of o.items){
      if(db.tickets.some(t=>t.itemId===it.id))continue;
      db.tickets.push({id:uid('tkt'),orderId:o.id,itemId:it.id,number:'BZT-'+code(4)+'-'+code(4),token:rnd(32),status:'VALID',checkedAt:null,by:null,created:now()});
    }
    const c=S.cust(o.customerId);
    if(c.email)db.notifications.unshift({id:uid('ntf'),channel:'EMAIL',to:c.email,template:'Электронные билеты',order:o.number,status:'Отправлено (демо)',at:now()});
    save();
  },
  sweep(){const t=now();for(const o of db.orders)if(o.status==='PENDING_PAYMENT'&&o.holdExp<=t)S.expireOrder(o.id,'sweep')},
  reconcile(){
    for(const p of db.payments){
      if(p.status!=='PENDING'&&p.status!=='PROCESSING')continue;
      const st=Provider.getStatus(p.ext);
      if(st&&st.status!=='PENDING'){S.recordPoll(p,st);S.applyProviderStatus(p,st);save()}
    }
  },
  refund(orderId,itemIds,reason,actor){
    const o=S.order(orderId);
    if(o.status!=='PAID_CONFLICT')throw err('CONFLICT','Билеты возврату не подлежат. Возврат денег возможен только если оплата пришла после окончания брони и места уже заняты.');
    const p=db.payments.find(p=>p.orderId===o.id&&(p.status==='PAID'||p.status==='PARTIALLY_REFUNDED'));
    if(!p)throw err('CONFLICT','Не найден оплаченный платёж');
    const items=o.items.filter(it=>it.status!=='REFUNDED'); // late-payment order: always a full refund
    if(!items.length)throw err('VALIDATION_ERROR','Выберите места для возврата');
    for(const it of items){const t=db.tickets.find(t=>t.itemId===it.id);if(t&&t.status==='USED')throw err('CONFLICT',`Билет ряд ${it.r}, место ${it.n} уже использован — возврат невозможен`)}
    if(!reason||reason.trim().length<3)throw err('VALIDATION_ERROR','Укажите причину возврата');
    const amount=items.reduce((a,i)=>a+i.price,0);
    const ref={id:uid('rf'),paymentId:p.id,orderId:o.id,amount,status:'REQUESTED',reason:reason.trim(),items:items.map(i=>i.id),idem:uid('idem'),by:actor,at:now(),providerRef:null};
    db.refunds.unshift(ref);
    const r=Provider.refund(p.ext,amount);
    if(r.status!=='SUCCEEDED'){ref.status='FAILED';ref.note=r.reason;save();throw err('CONFLICT','Провайдер отклонил возврат: '+r.reason)}
    ref.status='SUCCEEDED';ref.providerRef=r.ref;ref.done=now();
    for(const it of items){
      it.status='REFUNDED';
      const t=db.tickets.find(t=>t.itemId===it.id);if(t)t.status='REFUNDED';
      const k=S.key(o.scrId,it.seatId);if(db.locks[k]&&db.locks[k].orderId===o.id)delete db.locks[k];
    }
    const left=o.items.filter(i=>i.status==='ACTIVE').length;
    if(o.status!=='PAID_CONFLICT'||!left)o.status=left?'PARTIALLY_REFUNDED':'REFUNDED';
    p.status=left?'PARTIALLY_REFUNDED':'REFUNDED';
    S.audit(actor,'refund.succeeded','order',o.number,money(amount)+' · '+reason);
    save();return ref;
  },
  adminCancel(orderId,actor){const o=S.order(orderId);if(o.status!=='PENDING_PAYMENT')throw err('CONFLICT','Отменить можно только неоплаченный заказ');S.cancelByCustomer(o.token);S.audit(actor,'order.cancel','order',o.number)},
  /* POST /api/staff/tickets/validate */
  validate(input,scrId,commit,staff){
    const s=String(input||'').trim();
    let t=null;
    if(s.startsWith('BZ1.'))t=db.tickets.find(x=>x.token===s.slice(4));
    else if(s)t=db.tickets.find(x=>x.number===s.toUpperCase());
    const log=res=>{db.scans.unshift({id:uid('scn'),ticketId:t?t.id:null,res,staff,at:now()});if(db.scans.length>300)db.scans.length=300;save()};
    if(!t){log('INVALID_TOKEN');return{res:'INVALID_TOKEN'}}
    const o=S.order(t.orderId),it=o.items.find(i=>i.id===t.itemId),scr=S.scr(o.scrId),h=S.hall(scr.hallId);
    const info={number:t.number,title:scr.title,startsAt:scr.startsAt,hall:h.name,r:it.r,n:it.n,status:t.status,checkedAt:t.checkedAt,cat:it.cat};
    if(scrId&&o.scrId!==scrId){log('WRONG_SCREENING');return{res:'WRONG_SCREENING',info}}
    if(t.status==='USED'){log('ALREADY_USED');return{res:'ALREADY_USED',info}}
    if(t.status==='REFUNDED'){log('REFUNDED');return{res:'REFUNDED',info}}
    if(t.status==='CANCELLED'){log('CANCELLED');return{res:'CANCELLED',info}}
    if(commit){t.status='USED';t.checkedAt=now();t.by=staff;info.status='USED';info.checkedAt=t.checkedAt}
    log(commit?'ACCEPTED':'CHECK_ONLY');return{res:commit?'ACCEPTED':'VALID',info};
  },
  saveScreening(data,actor){
    const isNew=!data.id;
    if(!S.hall(data.hallId))throw err('VALIDATION_ERROR','Выберите зал');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(data.date)||!/^\d{2}:\d{2}$/.test(data.time))throw err('VALIDATION_ERROR','Укажите дату и время');
    const price=parseInt(data.price,10),vip=parseInt(data.vipPrice||data.price,10);
    if(!(price>0)||!(vip>0))throw err('VALIDATION_ERROR','Цена должна быть больше нуля');
    const limit=data.limit?parseInt(data.limit,10):null,holdMin=data.holdMin?parseInt(data.holdMin,10):null;
    if(holdMin!==null&&(holdMin<3||holdMin>60))throw err('VALIDATION_ERROR','Время брони: от 3 до 60 минут');
    let s=isNew?{id:uid('scr'),title:'Бажа'}:S.scr(data.id);
    if(!isNew&&s.hallId!==data.hallId&&Object.keys(db.locks).some(k=>k.startsWith(s.id+'|')))throw err('CONFLICT','Нельзя сменить зал — на сеанс уже есть брони или продажи');
    Object.assign(s,{hallId:data.hallId,title:(data.title||'Бажа').trim(),startsAt:data.date+'T'+data.time,price,vipPrice:vip,status:data.status,limit,holdMin});
    if(isNew)db.screenings.push(s);
    S.audit(actor,isNew?'screening.create':'screening.update','screening',s.startsAt+' '+S.hall(s.hallId).name);
    save();return s;
  },
  saveHall(hallId,seats,expectedVer,actor){
    const h=S.hall(hallId);
    if(h.ver!==expectedVer)throw err('CONFLICT','Схему изменил другой администратор. Обновите страницу.');
    const seen=new Set();for(const s of seats){const k=s.r+':'+s.n;if(seen.has(k))throw err('VALIDATION_ERROR','Повтор места '+k);seen.add(k)}
    const usedIds=new Set(Object.entries(db.locks).filter(([k])=>db.screenings.some(sc=>sc.hallId===hallId&&k.startsWith(sc.id+'|'))).map(([k])=>k.split('|')[1]));
    const byRN=new Map(h.seats.map(s=>[s.r+':'+s.n,s]));
    const next=seats.map(s=>{const old=byRN.get(s.r+':'+s.n);return{...s,id:old?old.id:uid('st')}});
    const nextIds=new Set(next.map(s=>s.id));
    for(const id of usedIds){const ns=next.find(s=>s.id===id);if(!nextIds.has(id)||!ns.active){const o=h.seats.find(s=>s.id===id);throw err('CONFLICT',`Место ряд ${o.r}, место ${o.n} уже забронировано или продано — его нельзя убрать`)}}
    h.seats=next;h.ver++;
    S.audit(actor,'hall.seats.save','hall',h.name,next.length+' мест');save();
  }
};

const DEMO_NAMES=['Айгерим С.','Нурлан К.','Дана Т.','Ерлан Б.','Алия М.','Тимур Ж.','Мадина А.','Арман Е.','Сауле Н.','Данияр О.','Жанна Р.','Ислам Д.'];
function demoPay(token){
  const o=S.byToken(token);let p=db.payments.find(x=>x.orderId===o.id&&x.status==='PENDING');
  if(!p)p=db.settings.invoiceMode==='manual'?S.manualInvoice(o.id,'демо'):S.startPayment(token);
  if(p.provider==='kaspi-manual')return S.manualPaid(p.id,'демо');
  Provider.customerAction(p.ext,true);S.handleWebhook(Provider.makeEvent(p.ext));
}
function demoBuy(scr,count,name,phone,pay){
  const st=S.statuses(scr.id),h=S.hall(scr.hallId);
  const free=h.seats.filter(s=>st[s.id]==='AVAILABLE');if(free.length<count)return null;
  const start=free[Math.floor(Math.random()*(free.length-count))];
  const row=free.filter(s=>s.r===start.r&&s.n>=start.n).slice(0,count);
  const picks=row.length===count?row:free.slice(0,count);
  try{
    const {order,token}=S.createOrder({idem:uid('idem'),scrId:scr.id,seatIds:picks.map(s=>s.id),name,session:S.issueSession(phone),email:'',offer:true,pd:true});
    if(pay)demoPay(token)
    return order;
  }catch(e){return null}
}
function seedSales(){
  db.screenings.slice(0,5).forEach((scr,si)=>{
    const n=[6,4,7,3,2][si];
    for(let i=0;i<n;i++)demoBuy(scr,1+Math.floor(Math.random()*4),DEMO_NAMES[(si*3+i)%DEMO_NAMES.length]+' (демо)','+7700'+String(1000000+si*100+i).slice(-7),true);
  });
  S.audit(null,'demo.seed','system','—','Созданы демо-данные');save();
}

var RULES_EXTRA;
function trS(s){
  if(ui.lang!=='kk'||!s)return s;
  const m=String(s).match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return s;
  let out=KK[core];
  if(out===undefined){
    if(core.includes(' · '))out=core.split(' · ').map(trS).join(' · ');
    else{out=core;for(const [re,rp] of RULES.concat(RULES_EXTRA||[]))out=out.replace(re,rp)}
    if(out===core&&/[а-яё]/i.test(core)&&window.__miss)window.__miss.add(core);
  }
  return m[1]+out+m[3];
}
function tr(root){
  if(ui.lang!=='kk'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const p=n.parentElement;if(!p||p.closest('[data-notr],script,style'))continue;const v=n.nodeValue,t=trS(v);if(t!==v)n.nodeValue=t}
  root.querySelectorAll('[placeholder],[data-void]').forEach(el=>{for(const a of ['placeholder','data-void']){const v=el.getAttribute(a);if(v){const t=trS(v);if(t!==v)el.setAttribute(a,t)}}});
}

function fitZoom(id){const h=S.hall(S.scr(id).hallId);const W=88+Math.max(...h.seats.map(s=>s.x+1),...(h.zones||[]).map(z=>z.x+z.w))*32;return Math.max(.5,Math.min(1,+((Math.min(innerWidth,1120)-58)/W).toFixed(2)))}

function myPendingOrderFor(scrId){const o=ui.pending&&S.byToken(ui.pending);return o&&o.scrId===scrId&&o.status==='PENDING_PAYMENT'?o:null}
const COLORS={AVAILABLE:'#22c55e',SELECTED:'#3b82f6',UNAVAILABLE:'#45454d',SOLD:'#991b1b',HELD:'#eab308',HELD_BY_YOU:'#3b82f6'};
function mapSVG(scr,st,opts={}){
  const h=S.hall(scr.hallId),U=32,padX=44,padT=78;
  const zs=h.zones||[];const maxX=Math.max(...h.seats.map(s=>s.x+1),...zs.map(z=>z.x+z.w)),maxY=Math.max(...h.seats.map(s=>s.y+1));
  const W=padX*2+maxX*U,H=padT+maxY*U+24;
  const rows=[...new Set(h.seats.map(s=>s.r))];
  let out=`<svg viewBox="0 0 ${W} ${H}" width="${Math.round(W*(opts.zoom||1))}" height="${Math.round(H*(opts.zoom||1))}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Схема зала">`;
  if(opts.bg)out+=`<image href="${opts.bg}" x="0" y="0" width="${W}" height="${H}" opacity=".35" preserveAspectRatio="xMidYMid meet"/>`;
  out+=`<path d="M${padX} 40 Q ${W/2} 14 ${W-padX} 40" stroke="#d91c2b" stroke-width="4" fill="none" stroke-linecap="round"/><text x="${W/2}" y="60" fill="#9a9aa3" font-size="11" text-anchor="middle" letter-spacing="4">ЭКРАН</text>`;
  for(const r of rows){const y=padT+(h.seats.find(s=>s.r===r).y)*U+U/2+4;out+=`<text x="${padX/2}" y="${y}" fill="#6b6b74" font-size="11" text-anchor="middle">${r}</text><text x="${W-padX/2}" y="${y}" fill="#6b6b74" font-size="11" text-anchor="middle">${r}</text>`}
  for(const z of zs)out+=`<rect x="${padX+z.x*U}" y="${padT+z.y*U+3}" width="${z.w*U}" height="${z.h*U}" rx="6" fill="#2a2a30"/><text x="${padX+(z.x+z.w/2)*U}" y="${padT+(z.y+z.h/2)*U+7}" fill="#c9c9cf" font-size="12" text-anchor="middle">${esc(z.t)}</text>`;
  for(const s of h.seats){
    const x=padX+s.x*U+3,y=padT+s.y*U+3,w=U-6;
    let fill,txt='#06240f',stroke='none';
    if(opts.editor){fill=!s.active?'#2c2c32':s.cat==='VIP'?'#a16207':s.cat==='ACCESSIBLE'?'#1d4ed8':'#3f3f46';txt='#fff'}
    else{const v=st[s.id];const sel=ui.sel.includes(s.id);
      fill=sel?COLORS.SELECTED:COLORS[v];
      if(sel||v==='HELD_BY_YOU')txt='#fff';else if(v==='SOLD'||v==='UNAVAILABLE')txt='rgba(255,255,255,.45)';else if(v==='HELD')txt='#3a2a00';
      if(ui.tapped===s.id)stroke='#fff'}
    if(s.cat==='VIP'&&!opts.editor)stroke=stroke==='none'?'#fbbf24':stroke;
    out+=`<g class="seat" onclick="${opts.editor?`edSeat('${s.id}')`:`tapSeat('${s.id}')`}"><rect x="${x}" y="${y}" width="${w}" height="${w-2}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${stroke==='none'?0:2}"/><text x="${x+w/2}" y="${y+w/2+3}" font-size="11" text-anchor="middle" fill="${txt}">${s.cat==='ACCESSIBLE'?'♿':s.n}</text></g>`;
  }
  return out+'</svg>';
}

   <div class="between"><span class="muted small">Нажмите на место, чтобы выбрать.</span>
   <div class="row"><button class="btn sm" onclick="zoom(-1)" aria-label="Уменьшить">−</button><button class="btn sm" onclick="zoom(1)" aria-label="Увеличить">+</button></div></div>
   <div class="mapbox mt" id="mapbox"><div id="map" style="padding:10px">${mapSVG(scr,S.statuses(id,mine&&mine.id),{zoom:ui.zoom})}</div></div>
   <div class="mt">${legendHTML()}</div><div id="tap" class="mt">${tapInfo(scr)}</div>
  </div>
  <div class="bar"><div class="wrap" id="selbar">${selBar(scr)}</div></div>`;

function pvSeat(scr){
  return `<div class="wrap" style="padding:22px 18px 40px">${scrHeader(scr)}
   <div class="card r-warn mt mb" style="text-align:left"><b>Продажа билетов скоро откроется</b><div class="small">Сейчас можно посмотреть схему зала и выбрать, где хотите сидеть.</div></div>
   <div class="between"><span class="muted small">Нажмите на место, чтобы увидеть ряд и номер.</span><div class="row"><button class="btn sm" onclick="zoom(-1)" aria-label="−">−</button><button class="btn sm" onclick="zoom(1)" aria-label="+">+</button></div></div>
   <div class="mapbox mt" id="mapbox"><div id="map" style="padding:10px">${mapSVG(scr,S.statuses(scr.id),{zoom:ui.zoom})}</div></div>
   <div id="tap" class="mt">${tapInfo(scr)}</div><div id="selbar" style="display:none"></div></div>`;
}
function tapInfo(scr){
  if(!ui.tapped)return '<p class="muted small">Подсказка: на телефоне схему можно прокручивать пальцем и увеличивать кнопкой «+».</p>';
  const s=S.hall(scr.hallId).seats.find(x=>x.id===ui.tapped);if(!s)return'';
  const st=S.statuses(scr.id)[s.id];const sel=ui.sel.includes(s.id);
  const lab=sel?'Выбрано вами':{AVAILABLE:'Свободно',HELD:'Временно забронировано',HELD_BY_YOU:'Ваша бронь',SOLD:'Продано',UNAVAILABLE:'Недоступно'}[st];
  return `<div class="card between"><div><b>Ряд ${s.r}, место ${s.n}</b><div class="muted small">${CAT_RU[s.cat]} · ${lab}</div></div><b style="font-size:18px">${money(S.priceFor(scr,s))}</b></div>`;
}
function selBar(scr){
  const h=S.hall(scr.hallId);const seats=ui.sel.map(id=>h.seats.find(s=>s.id===id)).filter(Boolean);
  const total=seats.reduce((a,s)=>a+S.priceFor(scr,s),0);
  return `<div class="between"><div><div class="small muted">${seats.length?seats.map(s=>`Р${s.r}·М${s.n}`).join(', '):'Места не выбраны'}</div><b style="font-size:20px">${seats.length?seats.length+' × · '+money(total):'—'}</b></div>
  <button class="btn pri" ${seats.length?'':'disabled'} onclick="toContacts()">Далее</button></div>`;
}
function refreshSeatMap(){
  const scr=S.scr(ui.selScr);if(!scr||!$('#map'))return;
  const mine=myPendingOrderFor(scr.id);
  const st=S.statuses(scr.id,mine&&mine.id);
  const lost=ui.sel.filter(id=>st[id]!=='AVAILABLE');
  if(lost.length){ui.sel=ui.sel.filter(id=>!lost.includes(id));toast('Одно из выбранных мест только что заняли',true)}
  $('#map').innerHTML=mapSVG(scr,st,{zoom:ui.zoom});$('#tap').innerHTML=tapInfo(scr);$('#selbar').innerHTML=selBar(scr);
  ['#map','#tap','#selbar'].forEach(q=>tr($(q)));
}
function tapSeat(id){
  if(PV){ui.tapped=id;refreshSeatMap();return}
  const scr=S.scr(ui.selScr);const st=S.statuses(scr.id)[id];ui.tapped=id;
  if(ui.sel.includes(id))ui.sel=ui.sel.filter(x=>x!==id);
  else if(st==='AVAILABLE'){if(ui.sel.length>=db.settings.maxSeats)toast(`Не больше ${db.settings.maxSeats} мест в одном заказе`,true);else ui.sel.push(id)}
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  refreshSeatMap();
}
function zoom(d){ui.zoom=Math.max(.4,Math.min(2.6,+(ui.zoom+d*.3).toFixed(2)));refreshSeatMap()}
function toContacts(){if(!ui.sel.length)return;ui.step='contacts';render();window.scrollTo(0,0)}
function vContacts(scr){
  const h=S.hall(scr.hallId);const seats=ui.sel.map(id=>h.seats.find(s=>s.id===id));
  const total=seats.reduce((a,s)=>a+S.priceFor(scr,s),0);const f=ui.form;
  return `<div class="wrap" style="padding:22px 18px 30px;max-width:640px">${scrHeader(scr)}${stepsHTML(1)}
   <div class="card mb"><div class="between"><div><b>${seats.length} ${seats.length===1?'билет':'билета'}</b><div class="muted small">${seats.map(s=>`Ряд ${s.r}, место ${s.n}`).join(' · ')}</div></div><b>${money(total)}</b></div>
   <button class="btn sm ghost mt" onclick="ui.step='select';render()">Изменить места</button></div>
   ${me()?'':authBox()}
   <div style="${me()?'':'display:none'}">
   <div class="card mb between"><div><div class="muted small">Номер подтверждён:</div><b>${fmtPhone(me())}</b></div><button class="btn sm ghost" onclick="logout()">Сменить номер</button></div>
   <h3 class="mb">Контактные данные</h3>
   <label class="f"><span>Имя и фамилия *</span><input id="fName" autocomplete="name" value="${esc(f.name)}" oninput="ui.form.name=this.value;this.style.borderColor=''"></label>
   <label class="f"><span>Email — пришлём билеты (необязательно)</span><input id="fEmail" type="email" inputmode="email" autocomplete="email" value="${esc(f.email)}" oninput="ui.form.email=this.value"></label>
   <label class="check"><input type="checkbox" ${f.offer?'checked':''} onchange="ui.form.offer=this.checked"><span data-notr>${L('Я принимаю <a href="#/legal/offer">публичную оферту</a>. Билеты возврату не подлежат.','<a href="#/legal/offer">Жария офертаны</a> қабылдаймын. Билеттер қайтарылмайды.')}</span></label>
   <label class="check"><input type="checkbox" ${f.pd?'checked':''} onchange="ui.form.pd=this.checked"><span data-notr>${L('Согласен(на) на обработку персональных данных (<a href="#/legal/privacy">политика</a>)','Жеке деректерімді өңдеуге келісемін (<a href="#/legal/privacy">саясат</a>)')}</span></label>
   <button class="btn pri w mt" id="bookBtn" onclick="submitOrder()">Забронировать и получить счёт Kaspi</button>
   <p class="muted tiny mt">После нажатия места закрепляются за вами на ${S.holdMin(scr)} мин. Цены и наличие мест проверяет сервер.</p>
   </div>
  </div>`;
}
function submitOrder(){
  const scr=S.scr(ui.selScr);if(!ui.idem)ui.idem=uid('idem');
  const btn=$('#bookBtn');if(btn)btn.disabled=true;
  try{
    const {order,token}=S.createOrder({idem:ui.idem,scrId:scr.id,seatIds:ui.sel,...ui.form,session:ui.session});
    ui.pending=token;try{localStorage.setItem('bazha_pending',token)}catch(e){}
    ui.sel=[];ui.step='select';ui.idem=null;go('#/order/'+token);
  }catch(e){
    if(btn)btn.disabled=false;
    if(e.code==='SEATS_TAKEN'){ui.sel=ui.sel.filter(id=>!(e.details.seatIds||[]).includes(id));ui.idem=null;ui.step='select';toast(trS(e.message)+'. '+trS('Выберите другие места.'),true);render()}
    else{toast(e.message,true);const n=$('#fName');if(n&&e.message.includes('имя')){n.style.borderColor='#d91c2b';n.focus()}}
  }
}

function vOrder(token){
  const o=S.byToken(token);if(!o)return `<div class="wrap" style="padding:40px 18px"><h2>Заказ не найден</h2><p class="muted">Проверьте ссылку.</p></div>`;
  const scr=S.scr(o.scrId),c=S.cust(o.customerId);
  const tickets=db.tickets.filter(t=>t.orderId===o.id);
  const lastPay=db.payments.filter(p=>p.orderId===o.id).sort((a,b)=>b.created-a.created)[0];
  const inv=o.status==='PENDING_PAYMENT'&&lastPay&&lastPay.status==='PENDING'?lastPay:null;
  const itemsTbl=`<div class="tbl"><table><tr><th>Ряд</th><th>Место</th><th>Тип</th><th class="r">Цена</th></tr>${o.items.map(i=>`<tr><td>${i.r}</td><td>${i.n}</td><td class="muted">${CAT_RU[i.cat]}</td><td class="r">${money(i.price)}${i.status!=='ACTIVE'?' <span class="tiny muted">('+(i.status==='REFUNDED'?'возврат':'освобождено')+')</span>':''}</td></tr>`).join('')}<tr><td colspan="3"><b>Итого</b></td><td class="r"><b>${money(o.total)}</b></td></tr></table></div>`;
  const head=`<div class="between"><div><div class="muted small">Заказ</div><h1 style="font-size:26px;font-weight:800">${o.number}</h1></div>${inv?'<span class="badge b-yel">Счёт выставлен</span>':o.status==='PENDING_PAYMENT'?'<span class="badge b-yel">Ожидает счёт</span>':badgeFor(o.status)}</div>
   <div class="muted small mt">«${esc(scr.title)}» · ${fmtDateL(scr.startsAt)}, ${fmtTime(scr.startsAt)} · ${esc(S.hall(scr.hallId).name)}<br>${esc(c.name)} · ${fmtPhone(c.phone)}${c.email?' · '+esc(c.email):''}</div>`;
  let body='',step=2;
  if(inv){
    step=3;
    body=`<div class="card mt" style="border-color:#a16207">
     <h3>Счёт на оплату отправлен в Kaspi</h3>
     <div class="grid g3 mt">
      <div><div class="muted small">Сумма счёта</div><b style="font-size:20px">${money(o.total)}</b></div>
      <div><div class="muted small">Счёт выставлен на номер</div><b>${fmtPhone(c.phone)}</b></div>
      <div><div class="muted small">Оплатите в течение</div><b class="timer" style="font-size:20px" data-exp="${o.holdExp}">--:--</b></div>
     </div>
     <p class="mt2 mb"><b>Как оплатить:</b></p>
     <div class="small">1. Откройте приложение Kaspi.kz</div>
     <div class="small">2. Зайдите в «Сообщения» и откройте счёт на оплату</div>
     <div class="small">3. Оплатите счёт. Билеты появятся на этой странице автоматически</div>
     <p class="tiny muted mt">Если не оплатить вовремя, счёт отменится, а места освободятся.</p></div>
    ${inv.provider===Provider.name?`<div class="card mt r-warn" style="text-align:left"><b>ДЕМО: имитация приложения Kaspi.kz</b>
     <div class="row mt"><button class="btn pri" id="payBtn" onclick="simPay('${o.token}',true)">Оплатить счёт</button><button class="btn" id="declBtn" onclick="simPay('${o.token}',false)">Отклонить счёт</button></div></div>`:''}
    <div class="card mt">${itemsTbl}</div>
    <button class="btn ghost w mt" onclick="cancelOrder('${o.token}')">Отменить заказ</button>`;
  }else if(o.status==='PENDING_PAYMENT'){
    step=3;
    body=`<div class="result r-warn mt"><div class="big">Счёт скоро придёт</div><div class="small">Мы выставим счёт в приложении Kaspi.kz на номер ${fmtPhone(c.phone)}. После этого у вас будет ${S.holdMin(scr)} минут на оплату.</div><div class="small mt">Места закреплены за вами. Страницу можно не закрывать — она обновится сама.</div></div>
    <div class="card mt">${itemsTbl}</div>
    <button class="btn ghost w mt" onclick="cancelOrder('${o.token}')">Отменить заказ</button>`;
  }else if(o.status==='PAID'||o.status==='PARTIALLY_REFUNDED'||o.status==='REFUNDED'){
    step=4;
    body=`${o.status==='PAID'?`<div class="result r-ok mt"><div class="big">Оплата подтверждена</div><div class="small">Ваши билеты ниже. Покажите QR-код на входе — каждый действует один раз.</div></div>`:''}
    <div class="row mt2"><button class="btn" onclick="downloadPdf('${o.token}')">⬇ Скачать PDF</button><button class="btn ghost" onclick="copyLink('${o.token}')">Скопировать ссылку на билеты</button></div>
    ${c.email?`<p class="small muted mt">Билеты отправлены на ${esc(c.email)}.</p>`:'<p class="small muted mt">Сохраните ссылку на эту страницу — по ней билеты всегда доступны.</p>'}
    <div class="grid mt">${tickets.map(t=>ticketHTML(t,o)).join('')}</div>`;
  }else if(o.status==='PAID_CONFLICT'){
    body=`<div class="result r-warn mt"><div class="big">Оплата получена</div><div class="small">Но она пришла после окончания брони, и места уже купили. Администратор оформит полный возврат. Приносим извинения.</div></div>`;
  }else if(o.status==='EXPIRED'){
    body=`<div class="result r-bad mt"><div class="big">Время брони истекло</div><div class="small">Оплата не поступила, места освобождены.</div></div><a class="btn pri w mt" href="#/s/${scr.id}" onclick="startSelect('${scr.id}')">Выбрать места заново</a>`;
  }else if(o.status==='CANCELLED'){
    body=`<div class="result r-bad mt"><div class="big">Заказ отменён</div>${o.cancelReason?`<div class="small">${esc(o.cancelReason)}</div>`:''}</div><a class="btn w mt" href="#/screenings">К выбору зала</a>`;
  }
  return `<div class="wrap" style="padding:22px 18px 30px;max-width:720px">${stepsHTML(step)}${head}${body}</div>`;
}
function localDT(t){const d=new Date(t),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}
function ordSig(o){if(!o)return null;const lp=db.payments.filter(p=>p.orderId===o.id).sort((a,b)=>b.created-a.created)[0];return o.status+'|'+(lp?lp.id+lp.status:'')}
function simPay(token,ok){
  const o=S.byToken(token),p=o&&db.payments.find(x=>x.orderId===o.id&&x.status==='PENDING'&&x.provider===Provider.name);if(!p)return render();
  Provider.customerAction(p.ext,ok);S.handleWebhook(Provider.makeEvent(p.ext));window.scrollTo(0,0);render();
}
function cancelOrder(token){if(!confirm(trS('Отменить заказ и освободить места?')))return;try{S.cancelByCustomer(token);render()}catch(e){toast(e.message,true)}}
function copyLink(token){const u=location.href.split('#')[0]+'#/order/'+token;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Ссылка скопирована'),()=>prompt('Ссылка на билеты:',u))}
function printTickets(token){
  const o=S.byToken(token);const ts=db.tickets.filter(t=>t.orderId===o.id&&t.status!=='REFUNDED');
  const pa=$('#print-area');pa.innerHTML=ts.map(t=>ticketHTML(t,o)).join('');tr(pa);
  pa.querySelectorAll('[data-qr]').forEach(el=>{const q=qrcode(0,'M');q.addData(el.dataset.qr);q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})});
  setTimeout(()=>window.print(),50);
}

function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function ticketCanvas(t,o,logo){
  const it=o.items.find(i=>i.id===t.itemId),scr=S.scr(o.scrId),h=S.hall(scr.hallId),c=S.cinema(h.cinemaId),cu=S.cust(o.customerId);
  const W=1240,H=620,FF='Helvetica,Arial,sans-serif',cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#b3121f';g.fillRect(0,0,16,H);
  if(logo)g.drawImage(logo,48,30,logo.width*(92/logo.height),92);
  g.fillStyle='#0a0a0b';g.font='800 78px '+FF;g.fillText('«'+scr.title+'»',56,226);
  const F=[['Дата',trS(fmtDate(scr.startsAt))],['Время',fmtTime(scr.startsAt)],['Зал',trS(h.name)],['Ряд',it.r],['Место',it.n],['Цена',money(it.price)]];
  F.forEach(([k,v],i)=>{const x=56+(i%3)*262,y=300+Math.floor(i/3)*112;g.fillStyle='#6b6b74';g.font='600 21px '+FF;g.fillText(trS(k).toUpperCase(),x,y);g.fillStyle='#0a0a0b';g.font='700 42px '+FF;g.fillText(String(v),x,y+50)});
  g.fillStyle='#55555c';g.font='23px '+FF;g.fillText(c.name+', '+c.city,56,H-74);g.fillText(trS('Заказ')+' '+o.number+' · '+cu.name,56,H-40);
  g.strokeStyle='#c9c9cf';g.setLineDash([10,10]);g.lineWidth=2;g.beginPath();g.moveTo(848,30);g.lineTo(848,H-30);g.stroke();g.setLineDash([]);
  const q=qrcode(0,'M');q.addData('BZ1.'+t.token);q.make();const n=q.getModuleCount(),cell=Math.floor(310/n),qs=cell*n,qx=848+Math.round((W-848-qs)/2),qy=120;
  g.fillStyle='#0a0a0b';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(qx+k*cell,qy+r*cell,cell,cell);
  g.font='600 26px ui-monospace,Menlo,Consolas,monospace';g.textAlign='center';g.fillText(t.number,qx+qs/2,qy+qs+48);
  if(t.status!=='VALID'){g.fillStyle='#b3121f';g.font='800 30px '+FF;g.fillText(trS(ru(t.status)).toUpperCase(),qx+qs/2,90)}
  g.textAlign='left';return cv;
}
async function buildPdf(token){
  const o=S.byToken(token),ts=db.tickets.filter(t=>t.orderId===o.id&&t.status!=='REFUNDED'),logo=await loadImg(LOGO_B);
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,f)=>{off[n]=len;push(n+' 0 obj\n');f();push('\nendobj\n')};
  const PW=620,PH=310,n=ts.length;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Count '+n+' /Kids ['+ts.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>'));
  ts.forEach((t,i)=>{
    const cv=ticketCanvas(t,o,logo),bin=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),jpg=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)jpg[k]=bin.charCodeAt(k);
    const pg=3+i*3,cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
    obj(pg,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+(pg+2)+' 0 R >> >> /Contents '+(pg+1)+' 0 R >>'));
    obj(pg+1,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(pg+2,()=>{push('<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream')});
  });
  const xo=len,tot=3+n*3;
  push('xref\n0 '+tot+'\n0000000000 65535 f \n');
  for(let k=1;k<tot;k++)push(String(off[k]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF\n');
  const out=new Uint8Array(len);let p=0;for(const b of parts){out.set(b,p);p+=b.length}
  return{bytes:out,name:'bilet-'+o.number+'.pdf'};
}
async function downloadPdf(token){
  try{
    const {bytes,name}=await buildPdf(token);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('PDF-файл с билетами скачивается');
  }catch(e){console.error(e);toast('Не удалось создать PDF',true)}
}

/* ------------------------------ my tickets ------------------------------ */
function me(){return S.sessionPhone(ui.session)}
function phoneMask(el){
  let d=el.value.replace(/\D/g,'');
  if(d.length>=11||el.value.trim().startsWith('+7'))d=d.slice(1);
  d=d.slice(0,10);
  el.value='+7 '+[d.slice(0,3),d.slice(3,6),d.slice(6,8),d.slice(8,10)].filter(Boolean).join(' ');
  ui.auth.phone=el.value;
}
function authBox(){
  const a=ui.auth;
  return `<div class="card mb"><h3 class="mb">Вход по номеру телефона</h3>
   <p class="muted small" style="margin-top:-6px">Укажите номер, к которому привязан Kaspi. На него придёт код, а затем счёт на оплату.</p>
   <label class="f"><span>Номер телефона *</span><input id="aPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(a.phone)}" oninput="phoneMask(this)" onkeydown="if(event.key==='Enter')authSend()" ${a.sent?'disabled':''}></label>
   ${a.sent?`<label class="f"><span>Код из SMS</span><input id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="••••" style="letter-spacing:.4em;font-size:22px" oninput="this.value=ui.auth.code=this.value.replace(/\\D/g,'');if(ui.auth.code.length===4)authVerify()"></label>
   <div class="card r-warn small mb" style="text-align:left"><b>ДЕМО:</b> ваш код — <b style="font-size:18px;letter-spacing:.15em">${a.demoCode}</b>. В рабочей версии он придёт по SMS.</div>
   <div class="row"><button class="btn pri" onclick="authVerify()">Подтвердить</button><button class="btn ghost" onclick="authReset()">Изменить номер</button></div>`
   :`<button class="btn pri w" onclick="authSend()">Получить код</button>`}
  </div>`;
}
function authSend(){try{const r=S.requestCode(ui.auth.phone);Object.assign(ui.auth,{sent:true,code:'',demoCode:r.demoCode});render();const c=$('#aCode');if(c)c.focus()}catch(e){toast(e.message,true);const i=$('#aPhone');if(i)i.focus()}}
function authVerify(){
  try{
    ui.session=S.verifyCode(ui.auth.phone,ui.auth.code);try{localStorage.setItem('bazha_sess',ui.session)}catch(e){}
    ui.auth={phone:'+7 ',sent:false,code:'',demoCode:''};
    const c=db.customers.find(c=>c.phone===me());if(c){if(!ui.form.name)ui.form.name=c.name;if(!ui.form.email)ui.form.email=c.email||''}
    toast('Номер подтверждён');render();
  }catch(e){toast(e.message,true);ui.auth.code='';const i=$('#aCode');if(i){i.value='';i.focus()}}
}
function authReset(){ui.auth.sent=false;ui.auth.code='';render()}
function logout(){ui.session=null;try{localStorage.removeItem('bazha_sess')}catch(e){}ui.form.name='';ui.form.email='';render()}
function vMy(){
  const ph=me();
  if(!ph)return `<div class="wrap" style="padding:28px 18px;max-width:560px"><h1 class="h2">Мои билеты</h1>${authBox()}</div>`;
  const c=db.customers.find(c=>c.phone===ph);
  const orders=c?db.orders.filter(o=>o.customerId===c.id).sort((a,b)=>b.created-a.created):[];
  return `<div class="wrap" style="padding:28px 18px;max-width:720px"><h1 class="h2">Мои билеты</h1>

}

async function startCam(){
  const w=$('#camwrap');
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices){w.innerHTML='<div class="card mb small">Камера в этом браузере не поддерживается в демо. В рабочей версии используется сканер @zxing, который работает на iPhone и Android. Используйте ввод кода ниже.</div>';return}
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    w.innerHTML='<video id="cam" playsinline muted></video><button class="btn sm mt mb" onclick="stopCam()">Остановить камеру</button>';
    const v=$('#cam');v.srcObject=camStream;await v.play();
    const det=new BarcodeDetector({formats:['qr_code']});
    const loop=async()=>{if(!camStream)return;try{const c=await det.detect(v);if(c.length){const val=c[0].rawValue;stopCam();doScan(val);return}}catch(e){}requestAnimationFrame(loop)};loop();
  }catch(e){w.innerHTML='<div class="card mb small">Нет доступа к камере: '+esc(e.message)+'</div>'}
}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const w=$('#camwrap');if(w)w.innerHTML=''}

  return `<a href="#/admin/orders" class="muted small" style="text-decoration:none">← Все заказы</a>
  <div class="card mt"><div class="between"><div><h3 style="font-size:22px">${o.number}</h3><div class="muted small">${fmtTs(o.created)}${o.paidAt?' · оплачен '+fmtTs(o.paidAt):''}</div></div>${badgeFor(o.status)}</div>
   <div class="grid g2 mt"><div><div class="muted small">Клиент</div>${esc(c.name)}<br>${fmtPhone(c.phone)}${c.email?'<br>'+esc(c.email):''}</div><div><div class="muted small">Сеанс</div>«${esc(s.title)}» · ${fmtDateL(s.startsAt)}, ${fmtTime(s.startsAt)}<br>${esc(S.hall(s.hallId).name)}</div></div>
   <div class="row mt"><a class="btn sm" href="#/order/${o.token}">Открыть страницу клиента</a>${o.status==='PENDING_PAYMENT'?`<button class="btn sm" onclick="admCancel('${o.id}')">Отменить заказ</button>`:''}${tks.length&&c.email?`<button class="btn sm" onclick="resend('${o.id}')">Отправить билеты повторно</button>`:''}</div></div>
  <div class="card mt"><h3 class="mb">Места и билеты</h3><div class="tbl"><table><tr>${canRefund?'<th></th>':''}<th>Место</th><th>Билет</th><th>Статус</th><th class="r">Цена</th></tr>
   ${o.items.map(i=>{const t=tks.find(t=>t.itemId===i.id);const can=canRefund&&i.status==='ACTIVE'&&(!t||t.status==='VALID');return `<tr>${canRefund?`<td><input type="checkbox" class="rfi" value="${i.id}" ${can?'':'disabled'}></td>`:''}<td>Ряд ${i.r}, место ${i.n}<div class="tiny muted">${CAT_RU[i.cat]}</div></td><td class="tiny">${t?t.number+(t.checkedAt?'<br>вход '+fmtTs(t.checkedAt):''):'—'}</td><td>${t?badgeFor(t.status):'<span class="badge">'+(i.status==='ACTIVE'?'—':i.status==='REFUNDED'?'Возврат':'Освобождено')+'</span>'}</td><td class="r">${money(i.price)}</td></tr>`}).join('')}</table></div>
   ${canRefund?`<label class="f mt"><span>Причина возврата</span><input id="rfReason" placeholder="Например: заявление клиента"></label><div class="row"><button class="btn" onclick="doRefund('${o.id}',true)">Полный возврат</button></div><p class="tiny muted mt">Возврат отправляется провайдеру. Билеты аннулируются и места освобождаются только после подтверждения провайдера.</p>`:''}
  </div>
  <div class="card mt"><h3 class="mb">Платежи</h3><div class="tbl"><table><tr><th>Транзакция</th><th>Провайдер</th><th>Статус</th><th class="r">Сумма</th></tr>${pays.map(p=>`<tr><td class="tiny">${p.ext}<br>${fmtTs(p.created)}${p.fail?'<br><span style="color:#fca5a5">'+esc(p.fail)+'</span>':''}</td><td>${p.provider}</td><td>${badgeFor(p.status)}</td><td class="r">${money(p.amount)}</td></tr>`).join('')||'<tr><td class="muted">Нет</td></tr>'}</table></div>
   <h3 class="mb mt2">События платежей</h3><div class="tbl"><table>${evs.map(e=>`<tr><td class="tiny">${fmtTs(e.at)}<br>${e.kind==='poll'?'Сверка':'Webhook'} ${e.eventId}</td><td class="tiny">${e.status}${e.kind==='webhook'?' · подпись '+(e.sigOk===false?'✗':'✓'):''}</td><td><span class="badge ${e.proc==='PROCESSED'?'b-green':e.proc==='IGNORED'?'':'b-red'}">${e.proc}</span><div class="tiny muted">${esc(e.note||'')}</div></td></tr>`).join('')||'<tr><td class="muted">Нет</td></tr>'}</table></div></div>
  ${rfs.length?`<div class="card mt"><h3 class="mb">История возвратов</h3><div class="tbl"><table>${rfs.map(r=>`<tr><td class="tiny">${fmtTs(r.at)}<br>${esc(r.by)}</td><td>${esc(r.reason)}<div class="tiny muted">${r.providerRef||''}</div></td><td>${badgeFor(r.status)}</td><td class="r">${money(r.amount)}</td></tr>`).join('')}</table></div></div>`:''}`;
}
function cp(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Скопировано: '+t),()=>prompt('Скопируйте:',t))}
function aInvoices(){
  const manual=db.settings.invoiceMode==='manual';
  const pend=db.orders.filter(o=>o.status==='PENDING_PAYMENT').sort((a,b)=>a.created-b.created);
  const need=pend.filter(o=>!db.payments.some(p=>p.orderId===o.id&&p.status==='PENDING'));
  const wait=pend.filter(o=>db.payments.some(p=>p.orderId===o.id&&p.status==='PENDING'));
  const late=db.payments.filter(p=>p.provider==='kaspi-manual'&&p.status==='EXPIRED').sort((a,b)=>b.created-a.created).slice(0,15);
  const row=(o,btns)=>{const c=S.cust(o.customerId),ph=c.phone.slice(2);return `<tr><td><a href="#/admin/order/${o.id}"><b>${o.number}</b></a><div class="tiny muted">${esc(c.name)}</div></td><td><button class="btn sm" onclick="cp('${ph}')">${fmtPhone(c.phone)} ⧉</button></td><td class="r"><button class="btn sm" onclick="cp('${o.total}')">${money(o.total)} ⧉</button></td><td><span class="timer" data-exp="${o.holdExp}">--:--</span></td><td class="r">${btns}</td></tr>`};
  const head='<tr><th>Заказ</th><th>Номер Kaspi</th><th class="r">Сумма</th><th>Осталось</th><th></th></tr>';
  return `<div class="card mb ${manual?'r-warn':'r-ok'}" style="text-align:left"><b>Режим: ${manual?'ручной':'автоматический (в демо — имитация сервиса)'}</b><div class="small">${manual?'Вы сами выставляете счёт в Kaspi Pay: «Удалённая оплата» → «Выставить счёт», затем отмечаете здесь.':'Счёт выставляется сразу после бронирования, оплата подтверждается уведомлением от сервиса. Здесь только наблюдение.'} Режим меняется в «Настройках».</div></div>
  ${manual?`<h3 class="mb">1. Выставить счёт (${need.length})</h3><div class="card tbl mb"><table>${head}${need.map(o=>row(o,`<button class="btn sm pri" onclick="invDo('issue','${o.id}')">Счёт выставлен</button> <button class="btn sm" onclick="invDo('undelivered','${o.id}')">Номер без Kaspi</button>`)).join('')||'<tr><td class="muted" colspan="5">Нет заказов</td></tr>'}</table></div>`:''}
  <h3 class="mb">${manual?'2. ':''}Ждут оплаты (${wait.length})</h3><div class="card tbl mb"><table>${head}${wait.map(o=>{const p=db.payments.find(p=>p.orderId===o.id&&p.status==='PENDING');return row(o,p.provider==='kaspi-manual'?`<button class="btn sm pri" onclick="invDo('paid','${p.id}')">Оплата получена</button>`:`<span class="tiny muted">${p.ext}</span>`)}).join('')||'<tr><td class="muted" colspan="5">Нет заказов</td></tr>'}</table></div>
  ${manual&&late.length?`<h3 class="mb">3. Срок истёк — отмените эти счета в Kaspi Pay</h3><div class="card tbl"><table>${late.map(p=>{const o=S.order(p.orderId),c=S.cust(o.customerId);return `<tr><td><b>${o.number}</b><div class="tiny muted">${fmtPhone(c.phone)} · ${money(p.amount)}</div></td><td>${badgeFor(o.status)}</td><td class="r"><button class="btn sm" onclick="invDo('paid','${p.id}')">Всё же оплатил</button></td></tr>`}).join('')}</table></div>`:''}`;
}
function invDo(act,id){
  try{
    if(act==='issue'){S.manualInvoice(id,actor());toast('Отмечено: счёт выставлен, у клиента '+S.holdMin(S.scr(S.order(id).scrId))+' минут')}
    else if(act==='paid'){if(!confirm('Оплата этого счёта видна в Kaspi Pay?'))return;S.manualPaid(id,actor());toast('Оплата подтверждена, билеты выданы')}
    else if(act==='undelivered'){if(!confirm('Отменить заказ: счёт не удалось выставить?'))return;S.manualUndelivered(id,actor());toast('Заказ отменён')}
    render();
  }catch(e){toast(e.message,true)}
}
function doRefund(id,all){
  const o=S.order(id);let ids=all?o.items.filter(i=>i.status!=='REFUNDED').map(i=>i.id):[...document.querySelectorAll('.rfi:checked')].map(x=>x.value);
  const reason=$('#rfReason').value;
  if(!ids.length)return toast('Выберите места',true);
  const amt=o.items.filter(i=>ids.includes(i.id)).reduce((a,i)=>a+i.price,0);
  if(!confirm(`Вернуть ${money(amt)} клиенту?`))return;
  try{S.refund(id,ids,reason,actor());toast('Возврат выполнен');render()}catch(e){toast(e.message,true)}
}
function admCancel(id){try{S.adminCancel(id,actor());toast('Заказ отменён');render()}catch(e){toast(e.message,true)}}
function resend(id){const o=S.order(id),c=S.cust(o.customerId);db.notifications.unshift({id:uid('ntf'),channel:'EMAIL',to:c.email,template:'Электронные билеты (повторно)',order:o.number,status:'Отправлено (демо)',at:now()});S.audit(actor(),'order.resend','order',o.number);save();toast('Билеты отправлены на '+c.email)}
function aCustomers(){
  return `<div class="card tbl"><table><tr><th>Клиент</th><th>Контакты</th><th class="r">Билетов</th><th class="r">Сумма</th><th>Заказы</th></tr>${db.customers.map(c=>{const os=db.orders.filter(o=>o.customerId===c.id);const paid=os.filter(o=>['PAID','PARTIALLY_REFUNDED'].includes(o.status));const tk=paid.reduce((a,o)=>a+o.items.filter(i=>i.status==='ACTIVE').length,0);return `<tr><td>${esc(c.name)}</td><td class="small">${fmtPhone(c.phone)}${c.email?'<br>'+esc(c.email):''}</td><td class="r">${tk}</td><td class="r">${money(paid.reduce((a,o)=>a+o.total,0))}</td><td class="small">${os.map(o=>`<a href="#/admin/order/${o.id}">${o.number}</a>`).join('<br>')}</td></tr>`}).join('')}</table></div>`;
}
function aRefunds(){return `<div class="card tbl"><table><tr><th>Дата</th><th>Заказ</th><th>Причина</th><th>Статус</th><th class="r">Сумма</th></tr>${db.refunds.map(r=>{const o=S.order(r.orderId);return `<tr><td class="tiny">${fmtTs(r.at)}<br>${esc(r.by)}</td><td><a href="#/admin/order/${o.id}">${o.number}</a></td><td class="small">${esc(r.reason)}</td><td>${badgeFor(r.status)}</td><td class="r">${money(r.amount)}</td></tr>`}).join('')||'<tr><td class="muted" colspan="5">Возвратов пока нет</td></tr>'}</table></div>`}
function aExport(){return `<div class="grid g2">
  <div class="card"><h3>Заказы</h3><p class="muted small">Все заказы: номер, клиент, телефон, сеанс, места, сумма, статус.</p><button class="btn" onclick="exportOrders()">Скачать CSV</button></div>
  <div class="card"><h3>Список зрителей на вход</h3><p class="muted small">По сеансу: ряд, место, имя, номер билета, статус.</p><select id="exScr" class="mb">${db.screenings.map(s=>`<option value="${s.id}">${fmtDate(s.startsAt)} ${fmtTime(s.startsAt)} · ${esc(S.hall(s.hallId).name)}</option>`).join('')}</select><button class="btn" onclick="exportAttendees($('#exScr').value)">Скачать CSV</button></div></div>
  <p class="tiny muted mt">CSV открывается в Excel и Google Таблицах. В рабочей версии также есть выгрузка в .xlsx.</p>`}
function csvDownload(name,rows){const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100);S.audit(actor(),'export','file',name);toast('Файл '+name+' скачан')}
function exportOrders(){csvDownload('bazha_orders.csv',[['Заказ','Создан','Клиент','Телефон','Email','Сеанс','Зал','Места','Сумма','Статус'],...db.orders.map(o=>{const c=S.cust(o.customerId),s=S.scr(o.scrId);return[o.number,fmtTs(o.created),c.name,c.phone,c.email,s.startsAt.replace('T',' '),S.hall(s.hallId).name,o.items.map(i=>`Р${i.r}М${i.n}`).join(' '),o.total,ru(o.status)]})])}
function exportAttendees(sid){const rows=[];db.tickets.forEach(t=>{const o=S.order(t.orderId);if(o.scrId!==sid)return;const it=o.items.find(i=>i.id===t.itemId),c=S.cust(o.customerId);rows.push([it.r,it.n,c.name,c.phone,t.number,ru(t.status),o.number])});rows.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);csvDownload('bazha_attendees.csv',[['Ряд','Место','Имя','Телефон','Билет','Статус','Заказ'],...rows])}
function aSettings(){const st=db.settings;return `<div class="grid g2">
  <div class="card"><h3 class="mb">Продажи</h3>
   <label class="f"><span>Время брони, минут</span><input id="stHold" type="number" value="${st.holdMin}"></label>
   <label class="f"><span>Максимум мест в заказе</span><input id="stMax" type="number" value="${st.maxSeats}"></label>
   <label class="f"><span>Телефон поддержки</span><input id="stSup" value="${esc(st.support)}"></label>
   <label class="f"><span>Email поддержки</span><input id="stMail" value="${esc(st.email)}"></label>
   <button class="btn pri" onclick="saveSettings()">Сохранить</button></div>
  <div class="card"><h3 class="mb">Постер фильма</h3><p class="muted small">Официальный постер от организаторов.</p><input type="file" accept="image/*" onchange="setPoster(this)">${st.poster?`<img src="${st.poster}" style="width:120px;border-radius:10px;margin-top:12px;display:block"><button class="btn sm mt" onclick="db.settings.poster=null;save();render()">Убрать</button>`:''}
   <h3 class="mb mt2">Оплата: счёт Kaspi Pay</h3>
   <label class="f"><span>Как выставляются счета</span><select id="stMode"><option value="auto" ${st.invoiceMode!=='manual'?'selected':''}>Автоматически (через сервис; в демо — имитация)</option><option value="manual" ${st.invoiceMode==='manual'?'selected':''}>Вручную в приложении Kaspi Pay</option></select></label>
   <p class="tiny muted">Время на оплату счёта = «Время брони» слева. Сохраняется кнопкой «Сохранить».</p>
   <h3 class="mb mt2">Демо</h3><button class="btn sm" onclick="if(confirm('Сбросить все демо-данные?')){try{localStorage.removeItem('${STORE_KEY}');localStorage.removeItem('bazha_pending')}catch(e){}db=seedDb();ui.pending=null;save();go('#/')}">Сбросить демо-данные</button></div></div>`}
function saveSettings(){const h=+$('#stHold').value,m=+$('#stMax').value;if(!(h>=3&&h<=60))return toast('Бронь: от 3 до 60 минут',true);if(!(m>=1&&m<=50))return toast('Максимум мест: от 1 до 50',true);Object.assign(db.settings,{holdMin:h,maxSeats:m,support:$('#stSup').value.trim(),email:$('#stMail').value.trim(),invoiceMode:$('#stMode').value});S.audit(actor(),'settings.update','settings','—');save();toast('Сохранено')}
function setPoster(inp){const f=inp.files[0];if(!f)return;if(f.size>4e6)return toast('Файл больше 4 МБ',true);const r=new FileReader();r.onload=()=>{db.settings.poster=r.result;S.audit(actor(),'poster.upload','settings','poster');save();render()};r.readAsDataURL(f)}
function aLog(){return `<div class="grid g2"><div class="card"><h3 class="mb">Журнал действий</h3><div class="tbl"><table>${db.audit.slice(0,60).map(a=>`<tr><td class="tiny">${fmtTs(a.at)}<br>${esc(a.actor)}</td><td class="small"><span class="pill">${esc(a.action)}</span><div class="tiny muted">${esc(a.entityId)} ${esc(a.detail)}</div></td></tr>`).join('')}</table></div></div>
  <div class="card"><h3 class="mb">Сканирования на входе</h3><div class="tbl"><table>${db.scans.slice(0,40).map(s=>{const t=s.ticketId&&db.tickets.find(t=>t.id===s.ticketId);return `<tr><td class="tiny">${fmtTs(s.at)}<br>${esc(s.staff)}</td><td class="small">${t?t.number:'—'}</td><td><span class="badge ${s.res==='ACCEPTED'?'b-green':'b-red'}">${s.res}</span></td></tr>`}).join('')||'<tr><td class="muted">Пока нет</td></tr>'}</table></div>
  <h3 class="mb mt2">Уведомления</h3><div class="tbl"><table>${db.notifications.slice(0,20).map(n=>`<tr><td class="tiny">${fmtTs(n.at)}</td><td class="small">${n.channel} → ${esc(n.to)}<div class="tiny muted">${esc(n.template)} · ${n.order}</div></td><td class="tiny">${esc(n.status)}</td></tr>`).join('')||'<tr><td class="muted">Пока нет</td></tr>'}</table></div></div></div>`}

/* ============================ OTHER BUYER BOT ============================ */
function simulateOtherBuyer(){
  const r=route();let scr=r[0]==='s'?S.scr(r[1]):null;
  if(!scr){const open=db.screenings.filter(S.salesOpen);scr=open[Math.floor(Math.random()*open.length)]}
  if(!scr)return toast('Нет сеансов в продаже',true);
  const n=1+Math.floor(Math.random()*3),name=DEMO_NAMES[Math.floor(Math.random()*DEMO_NAMES.length)]+' (бот)';
  const o=demoBuy(scr,n,name,'+7701'+String(Math.floor(Math.random()*1e7)).padStart(7,'0'),false);
  if(!o)return toast('Свободных мест не хватает',true);
  o.holdExp=now()+45000;for(const k in db.locks)if(db.locks[k].orderId===o.id)db.locks[k].exp=o.holdExp;save();
  toast(`Другой покупатель забронировал: ${o.items.map(i=>'Р'+i.r+'·М'+i.n).join(', ')} (${fmtTime(scr.startsAt)})`);
  const willPay=Math.random()<.5;
  setTimeout(()=>{if(o.status!=='PENDING_PAYMENT')return;if(willPay){try{demoPay(o.token);toast('Другой покупатель оплатил свои места')}catch(e){}}},willPay?8000:0);
  if(r[0]==='s')refreshSeatMap();else if(r[0]!=='admin')render();
}

/* ================================ TICKER ================================ */
function updateTimers(){document.querySelectorAll('[data-exp]').forEach(el=>{const ms=Math.max(0,+el.dataset.exp-now());const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.style.color=ms<60000?'#f87171':''})}
let tick=0;
setInterval(()=>{
  if(PV)return;
  tick++;
  S.sweep();
  if(tick%4===0)S.reconcile();
  updateTimers();
  const r=route();
  if(r[0]==='s'&&ui.step==='select'&&tick%2===0)refreshSeatMap();
  if(r[0]==='order'){const o=S.byToken(r[1]);if(o&&ordSig(o)!==ui.lastOrderStatus)render()}
},1000);

/* ================================ START ================================ */
const DEMOBAR0=$('#demobar').innerHTML,FOOT0=$('footer').innerHTML;
load();
if(PV){ui.role='customer';document.body.classList.add('pv')}
document.documentElement.lang=ui.lang;
render();
</script>
