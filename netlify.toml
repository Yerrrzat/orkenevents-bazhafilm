# ORKEN EVENTS — Netlify settings
[build]
  publish = "public"          # only this folder is served to visitors

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # libraries are shipped as they are (not merged into one file) — this is the most predictable way to run them
  external_node_modules = ["tesseract.js-core", "pngjs", "jpeg-js", "@neondatabase/serverless", "nodemailer"]
  included_files = ["netlify/functions/data/**"]      # language data + self-test picture

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
