# ORKEN EVENTS — Netlify settings
[build]
  publish = "public"          # only this folder is served to visitors

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["tesseract.js"]            # text recognition for receipts (uses WebAssembly files)
  included_files = ["netlify/functions/data/**"]      # language data + self-test picture

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
